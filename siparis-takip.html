<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sipariş Takip &amp; İade — SLAW REZZ</title>
<meta name="description" content="Sipariş numaranız ve telefonunuzun son 4 hanesiyle siparişinizi takip edin, iade veya değişim talebi oluşturun.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,700;1,900&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/stil.css">
<style>
  .takip-kutu { max-width: 460px; margin: 0 auto; background: var(--beyaz); border: 1px solid var(--cizgi); padding: 2.4rem 2.2rem; }
  .takip-kutu h2 { font-family: var(--serif); font-size: 1.5rem; font-style: italic; margin-bottom: .4rem; }
  .takip-kutu .alt-metin { font-size: .84rem; color: var(--murekkep-yum); margin-bottom: 1.6rem; line-height: 1.5; }
  .ikili { display: grid; grid-template-columns: 1.6fr 1fr; gap: .9rem; }

  .siparis-panel { max-width: 720px; margin: 0 auto; }
  .panel-kart { background: var(--beyaz); border: 1px solid var(--cizgi); padding: 1.8rem; margin-bottom: 1.1rem; }
  .panel-ust { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: .8rem; border-bottom: 1px solid var(--cizgi); padding-bottom: 1.1rem; margin-bottom: 1.3rem; }
  .siparis-no { font-family: var(--serif); font-size: 1.35rem; font-weight: 700; letter-spacing: .01em; }
  .siparis-tarih { font-size: .76rem; color: var(--murekkep-yum); letter-spacing: .06em; text-transform: uppercase; margin-top: .2rem; }

  /* durum rayı — sayfanın ana görsel öğesi */
  .ray { display: flex; margin: .4rem 0 1.6rem; counter-reset: adim; }
  .ray-adim { flex: 1; text-align: center; position: relative; padding-top: 1.9rem; font-size: .72rem; letter-spacing: .04em; color: var(--murekkep-yum); }
  .ray-adim::before { content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 13px; height: 13px; border-radius: 50%; background: var(--krem-koyu); border: 2px solid var(--cizgi); z-index: 2; transition: .3s; }
  .ray-adim::after { content: ""; position: absolute; top: 6px; left: -50%; width: 100%; height: 2px; background: var(--cizgi); z-index: 1; }
  .ray-adim:first-child::after { display: none; }
  .ray-adim.gecti::before { background: var(--gul); border-color: var(--gul); }
  .ray-adim.gecti::after { background: var(--gul); }
  .ray-adim.simdi::before { background: var(--gul); border-color: var(--gul); box-shadow: 0 0 0 5px var(--gul-acik); }
  .ray-adim.simdi { color: var(--gul); font-weight: 600; }

  .durum-serit { padding: .9rem 1.2rem; border-left: 3px solid; margin-bottom: 1.4rem; font-size: .88rem; }
  .kalem-satir { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .7rem 0; border-bottom: 1px dashed var(--cizgi); font-size: .88rem; }
  .kalem-satir:last-child { border-bottom: none; }
  .kalem-ad { flex: 1; }
  .kalem-detay { font-size: .76rem; color: var(--murekkep-yum); }

  .ozet-satir { display: flex; justify-content: space-between; font-size: .86rem; padding: .3rem 0; }
  .ozet-satir.toplam { font-family: var(--serif); font-size: 1.15rem; font-weight: 700; border-top: 1px solid var(--cizgi); margin-top: .5rem; padding-top: .7rem; }

  .kargo-kutu { background: var(--krem); border: 1px dashed var(--cizgi); padding: 1rem 1.2rem; margin: 1.2rem 0; font-size: .86rem; }
  .kod-vurgu { font-family: var(--serif); font-size: 1.3rem; font-weight: 700; color: var(--gul); letter-spacing: .06em; }

  .iade-form { margin-top: 1.2rem; }
  .adet-sec { display: flex; align-items: center; gap: .5rem; }
  .adet-sec button { width: 26px; height: 26px; border: 1px solid var(--cizgi); background: var(--beyaz); font-size: .9rem; line-height: 1; cursor: pointer; }
  .adet-sec button:hover { border-color: var(--gul); color: var(--gul); }
  .adet-sec span { min-width: 34px; text-align: center; font-size: .86rem; }

  .talep-kart { border: 1px solid var(--cizgi); background: var(--krem); padding: 1.1rem 1.3rem; margin-bottom: .8rem; font-size: .86rem; }
  .rozet { display: inline-block; font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; padding: .25rem .7rem; border-radius: 999px; }
  .demo-not { font-size: .76rem; color: var(--murekkep-yum); background: #fff8e6; border: 1px solid #f0b429; padding: .7rem 1rem; margin-bottom: 1.2rem; }
  @media (max-width: 560px) { .ray-adim { font-size: .62rem; } .takip-kutu { padding: 1.6rem 1.2rem; } }
</style>
</head>
<body data-kok="">
<div class="duyuru">1.500 TL üzeri kargo bedava — WhatsApp sipariş: <span data-satici="telefon">0541 348 39 45</span></div>
<header class="ustbar">
  <a class="logo" href="index.html">SLAW <em>REZZ</em></a>
  <nav class="menu"><a href="index.html">Mağaza</a><a href="hukuk/iade.html">İade &amp; Kargo</a><a href="hukuk/iletisim.html">İletişim</a></nav>
  <div class="ust-ikonlar">
    <a href="hesap.html">Hesabım</a>
    <a class="sepet-link" href="sepet.html">Sepet<span class="sepet-sayac" style="display:none">0</span></a>
  </div>
</header>

<main class="bolum"><div id="icerik"></div></main>

<footer><div class="telif"><span>© <span data-yil></span> SLAW REZZ</span>
<span><a href="hukuk/kvkk.html" style="text-decoration:underline">KVKK</a> ·
<a href="hukuk/mesafeli-satis.html" style="text-decoration:underline">Mesafeli Satış</a></span></div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/magaza.js"></script>
<script>
(function () {
  const kok = document.getElementById("icerik");
  const RAY = ["odendi", "hazirlaniyor", "kargoda", "teslim"];   // görsel akış
  let siparis = null;
  let sorguNo = "", sorguSon4 = "";

  const kacar = (m) => String(m == null ? "" : m).replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- sorgu formu ----------
  function formGoster(mesaj) {
    const qp = new URLSearchParams(location.search);
    kok.innerHTML = `
      <div class="takip-kutu">
        <h2>Siparişim Nerede?</h2>
        <p class="alt-metin">Sipariş numaranız ve telefonunuzun <b>son 4 hanesi</b> ile
          siparişinizi görüntüleyebilir, iade veya değişim talebi oluşturabilirsiniz.
          Üyelik gerekmez.</p>
        ${!SLAW.sb() ? `<div class="demo-not"><b>Demo mod:</b> Site henüz veritabanına bağlı değil.
          Şu an yalnızca bu tarayıcıdan verilmiş siparişler sorgulanabilir.</div>` : ""}
        ${mesaj ? `<div class="uyari" style="margin-bottom:1rem">${mesaj}</div>` : ""}
        <div class="form-alan"><label>Sipariş Numarası</label>
          <input id="qNo" placeholder="SR-${new Date().getFullYear()}-00001" autocomplete="off" value="${kacar(qp.get("no") || sorguNo)}"></div>
        <div class="form-alan"><label>Telefonunuzun Son 4 Hanesi</label>
          <input id="qTel" inputmode="numeric" maxlength="4" placeholder="1234" autocomplete="off"></div>
        <button class="buton" id="qBtn" style="width:100%;margin-top:.6rem">Siparişimi Bul</button>
        <p class="alt-metin" style="margin:1.4rem 0 0;text-align:center">
          Sipariş numaranızı bulamıyor musunuz?
          <a href="hukuk/iletisim.html" style="text-decoration:underline">Bize ulaşın</a>.</p>
      </div>`;

    const btn = document.getElementById("qBtn");
    const calistir = async () => {
      const no = document.getElementById("qNo").value.trim();
      const son4 = document.getElementById("qTel").value.trim();
      if (!no || !/^[0-9]{4}$/.test(son4)) {
        formGoster("Sipariş numarası ve telefonunuzun son 4 hanesini girin."); return;
      }
      btn.disabled = true; btn.textContent = "Aranıyor…";
      try {
        const s = await SLAW.siparisSorgula(no, son4);
        if (!s) { sorguNo = no; formGoster("Bu bilgilerle bir sipariş bulunamadı. Numarayı ve telefonu kontrol edin."); return; }
        siparis = s; sorguNo = no; sorguSon4 = son4;
        siparisGoster();
      } catch (e) {
        sorguNo = no;
        formGoster(e.message === "cok_deneme"
          ? "Çok fazla deneme yapıldı. Güvenliğiniz için 15 dakika sonra tekrar deneyin."
          : "Sorgulama sırasında bir hata oluştu: " + kacar(e.message));
      }
    };
    btn.onclick = calistir;
    document.getElementById("qTel").addEventListener("keydown", (e) => { if (e.key === "Enter") calistir(); });
    // ödeme dönüşü bilgilendirmesi
    if (qp.get("odeme")) odemeBandi(qp.get("odeme") === "basarili");
  }

  function odemeBandi(basarili) {
    const b = document.createElement("div");
    b.className = "uyari";
    b.style.cssText = "max-width:460px;margin:0 auto 1.2rem;" +
      (basarili ? "border-color:#2f9e44;background:#e7f5ec" : "");
    b.innerHTML = basarili
      ? "<b>Ödemeniz alındı!</b> Siparişiniz hazırlanmaya başlanacak. Aşağıdan durumunu takip edebilirsiniz."
      : "Ödeme tamamlanamadı. Sepetiniz duruyor; tekrar deneyebilir veya WhatsApp'tan sipariş verebilirsiniz.";
    kok.before(b);
    history.replaceState({}, "", location.pathname);
  }

  // ---------- sipariş görünümü ----------
  function siparisGoster(bilgi) {
    const s = siparis;
    const dAdi = SLAW.durumAdi(s.durum, "musteri");
    const dRenk = SLAW.durumRengi(s.durum);
    const suAn = (SLAW.DURUMLAR[s.durum] || {}).adim;
    const iadeVar = (s.iadeler || []).length;
    const acikTalep = (s.iadeler || []).find((i) => ["talep_edildi", "onaylandi", "kargoda"].includes(i.durum));

    kok.innerHTML = `
      <div class="siparis-panel">
        ${bilgi ? `<div class="uyari" style="border-color:#2f9e44;background:#e7f5ec;margin-bottom:1rem">${bilgi}</div>` : ""}
        <div class="panel-kart">
          <div class="panel-ust">
            <div>
              <div class="siparis-no">${kacar(s.siparis_no || "")}</div>
              <div class="siparis-tarih">${new Date(s.created_at).toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" })}</div>
            </div>
            <div style="text-align:right">
              <span class="rozet" style="background:${dRenk}1f;color:${dRenk}">${kacar(dAdi)}</span>
              <div class="siparis-tarih" style="margin-top:.35rem">${kacar(s.ad || "")}</div>
            </div>
          </div>

          ${suAn >= 0 ? `<div class="ray">
            ${RAY.map((k) => {
              const a = SLAW.DURUMLAR[k].adim;
              const sinif = a < suAn ? "gecti" : a === suAn ? "simdi gecti" : "";
              return `<div class="ray-adim ${sinif}">${SLAW.DURUMLAR[k].musteri}</div>`;
            }).join("")}
          </div>` : `<div class="durum-serit" style="border-color:${dRenk};background:${dRenk}0f">
            Bu sipariş <b>${kacar(dAdi.toLowerCase())}</b> durumunda.</div>`}

          ${s.kargo_takip ? `<div class="kargo-kutu">
            <b>${kacar(SLAW.kargoFirmaAdi(s.kargo_firma) || "Kargo")}</b> —
            ${SLAW.kargoTakipLinki(s.kargo_firma, s.kargo_takip)
              ? `<a href="${SLAW.kargoTakipLinki(s.kargo_firma, s.kargo_takip)}" target="_blank" rel="noopener" style="text-decoration:underline;color:var(--gul)">${kacar(s.kargo_takip)} ↗</a>`
              : `<b>${kacar(s.kargo_takip)}</b>`}
            <div style="font-size:.78rem;color:var(--murekkep-yum);margin-top:.3rem">Takip numarası kargo firmasının sisteminde birkaç saat sonra görünür olabilir.</div>
          </div>` : ""}

          <h3 style="font-family:var(--serif);font-size:1.05rem;margin:1.2rem 0 .4rem">Ürünler</h3>
          ${(s.kalemler || []).map((k) => `
            <div class="kalem-satir">
              <div class="kalem-ad">${kacar(k.ad)}
                <div class="kalem-detay">Beden ${kacar(k.beden)} · ${k.adet} adet</div></div>
              <div>${SLAW.para((k.birim || 0) * k.adet)}</div>
            </div>`).join("")}

          <div style="margin-top:1rem">
            ${s.indirim ? `<div class="ozet-satir" style="color:#2f9e44"><span>Kupon indirimi</span><span>−${SLAW.para(s.indirim)}</span></div>` : ""}
            <div class="ozet-satir"><span>Kargo</span><span>${s.kargo ? SLAW.para(s.kargo) : "Ücretsiz"}</span></div>
            <div class="ozet-satir toplam"><span>Toplam</span><span>${SLAW.para(s.tutar)}</span></div>
          </div>

          <div style="font-size:.76rem;color:var(--murekkep-yum);margin-top:1.2rem;border-top:1px solid var(--cizgi);padding-top:.9rem">
            Teslimat: ${kacar(s.adres_maske || "")} ${kacar([s.ilce, s.sehir].filter(Boolean).join(" / "))} · ${kacar(s.telefon_maske || "")}
            <br>Güvenliğiniz için adres ve telefon bilgileriniz kısaltılarak gösterilir.
          </div>
        </div>

        ${iadeVar ? `<div class="panel-kart">
          <h3 style="font-family:var(--serif);font-size:1.05rem;margin-bottom:.9rem">İade / Değişim Talepleriniz</h3>
          ${(s.iadeler || []).map(talepKarti).join("")}
        </div>` : ""}

        <div id="iadeAlan"></div>

        <p style="text-align:center;margin-top:1.4rem">
          <button class="buton ikincil" id="geriBtn">Başka Sipariş Sorgula</button></p>
      </div>`;

    document.getElementById("geriBtn").onclick = () => { siparis = null; formGoster(); };

    const alan = document.getElementById("iadeAlan");
    if (acikTalep) {
      alan.innerHTML = `<div class="panel-kart" style="text-align:center;color:var(--murekkep-yum);font-size:.88rem">
        Bu sipariş için açık bir talebiniz olduğu sürece yeni talep oluşturulamaz.</div>`;
    } else if (SLAW.iadeEdilebilirMi(s)) {
      iadeFormuCiz(alan);
    } else if (["kargoda", "teslim"].includes(s.durum)) {
      alan.innerHTML = `<div class="panel-kart" style="text-align:center;color:var(--murekkep-yum);font-size:.88rem">
        İade süresi (teslimden itibaren 15 gün) dolmuş görünüyor.
        Yine de <a href="hukuk/iletisim.html" style="text-decoration:underline">bize yazabilirsiniz</a>.</div>`;
    }
  }

  function talepKarti(i) {
    const renk = SLAW.durumRengi(i.durum, "iade");
    return `<div class="talep-kart">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem;margin-bottom:.5rem">
        <b>${i.tip === "degisim" ? "Değişim" : "İade"} talebi</b>
        <span class="rozet" style="background:${renk}1f;color:${renk}">${kacar(SLAW.durumAdi(i.durum, "musteri", "iade"))}</span>
      </div>
      <div class="kalem-detay">${new Date(i.created_at).toLocaleDateString("tr-TR")} ·
        ${kacar(SLAW.IADE_SEBEPLERI[i.sebep] || i.sebep)} · ${SLAW.para(i.tutar)}</div>
      <div class="kalem-detay" style="margin-top:.3rem">
        ${(i.kalemler || []).map((k) => kacar(k.ad) + " (" + kacar(k.beden) + " × " + k.adet + ")").join(" · ")}</div>
      ${i.durum === "onaylandi" && i.kargo_kodu ? `<div class="kargo-kutu" style="margin:.8rem 0 0">
        Talebiniz onaylandı. Ürünü aşağıdaki kodla <b>${kacar(SLAW.kargoFirmaAdi(i.kargo_firma) || "anlaşmalı kargo")}</b> şubesine ücretsiz teslim edebilirsiniz:
        <div class="kod-vurgu" style="margin-top:.4rem">${kacar(i.kargo_kodu)}</div></div>` : ""}
      ${i.durum === "reddedildi" && i.yonetici_notu ? `<div style="margin-top:.6rem;color:#a33">
        <b>Gerekçe:</b> ${kacar(i.yonetici_notu)}</div>` : ""}
      ${i.durum === "tamamlandi" ? `<div style="margin-top:.6rem;color:#2f9e44">
        İadeniz tamamlandı. Bedel iadesi ödeme yönteminize yansıtılmıştır.</div>` : ""}
    </div>`;
  }

  // ---------- iade formu ----------
  function iadeFormuCiz(alan) {
    const s = siparis;
    const secim = (s.kalemler || []).map((k) => ({ ...k, sec: 0 }));

    alan.innerHTML = `<div class="panel-kart iade-form">
      <h3 style="font-family:var(--serif);font-size:1.15rem;font-style:italic;margin-bottom:.3rem">İade veya Değişim Talebi</h3>
      <p class="alt-metin" style="font-size:.82rem;color:var(--murekkep-yum);margin-bottom:1.2rem">
        İade etmek istediğiniz ürünleri ve adetlerini seçin. Ürünler kullanılmamış,
        yıkanmamış ve etiketi sökülmemiş olmalıdır.
        <a href="hukuk/iade.html" style="text-decoration:underline">Koşulların tamamı</a>.</p>

      <div id="kalemSecim">
        ${secim.map((k, idx) => `
          <div class="kalem-satir">
            <div class="kalem-ad">${kacar(k.ad)}
              <div class="kalem-detay">Beden ${kacar(k.beden)} · ${k.adet} adet · ${SLAW.para(k.birim)}</div></div>
            <div class="adet-sec">
              <button type="button" data-eksi="${idx}" aria-label="azalt">−</button>
              <span id="adet${idx}">0</span>
              <button type="button" data-arti="${idx}" aria-label="artır">+</button>
            </div>
          </div>`).join("")}
      </div>

      <div class="ozet-satir toplam" style="margin-bottom:1.2rem">
        <span>İade tutarı</span><span id="iadeTutar">${SLAW.para(0)}</span></div>

      <div class="form-alan"><label>Talep Tipi</label>
        <select id="iTip"><option value="iade">İade (bedel iadesi)</option>
          <option value="degisim">Değişim (farklı beden/ürün)</option></select></div>
      <div class="form-alan"><label>Sebep *</label>
        <select id="iSebep">
          <option value="">Seçiniz…</option>
          ${Object.entries(SLAW.IADE_SEBEPLERI).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}
        </select></div>
      <div class="form-alan"><label>Açıklama</label>
        <textarea id="iAciklama" rows="3" maxlength="1000" placeholder="Varsa detay ekleyin (örn. hangi bedeni istediğiniz)"></textarea></div>

      <label style="display:flex;gap:.6rem;align-items:flex-start;font-size:.82rem;margin:.6rem 0 1.1rem">
        <input type="checkbox" id="iOnay" style="margin-top:.2rem">
        <span>Ürünlerin kullanılmamış ve etiketi sökülmemiş olduğunu,
          <a href="hukuk/iade.html" style="text-decoration:underline">iade koşullarını</a>
          okuduğumu onaylıyorum.</span></label>

      <div id="iMesaj"></div>
      <button class="buton" id="iGonder" style="width:100%">Talebi Gönder</button>
    </div>`;

    const tutarYaz = () => {
      const t = secim.reduce((a, k) => a + k.birim * k.sec, 0);
      document.getElementById("iadeTutar").textContent = SLAW.para(t);
    };
    alan.querySelectorAll("[data-arti]").forEach((b) => b.onclick = () => {
      const i = +b.dataset.arti;
      if (secim[i].sec < secim[i].adet) secim[i].sec++;
      document.getElementById("adet" + i).textContent = secim[i].sec; tutarYaz();
    });
    alan.querySelectorAll("[data-eksi]").forEach((b) => b.onclick = () => {
      const i = +b.dataset.eksi;
      if (secim[i].sec > 0) secim[i].sec--;
      document.getElementById("adet" + i).textContent = secim[i].sec; tutarYaz();
    });

    document.getElementById("iGonder").onclick = async () => {
      const mesaj = document.getElementById("iMesaj");
      const secilen = secim.filter((k) => k.sec > 0)
        .map((k) => ({ id: k.id, ad: k.ad, beden: k.beden, adet: k.sec, birim: k.birim }));
      const sebep = document.getElementById("iSebep").value;
      if (!secilen.length) { mesaj.innerHTML = '<div class="uyari">En az bir ürün seçin.</div>'; return; }
      if (!sebep) { mesaj.innerHTML = '<div class="uyari">Lütfen bir sebep seçin.</div>'; return; }
      if (!document.getElementById("iOnay").checked) {
        mesaj.innerHTML = '<div class="uyari">Devam etmek için iade koşullarını onaylayın.</div>'; return; }

      const btn = document.getElementById("iGonder");
      btn.disabled = true; btn.textContent = "Gönderiliyor…";
      try {
        await SLAW.iadeTalebiAc({
          siparis_no: s.siparis_no, tel_son4: sorguSon4, siparis_id: s.id,
          tip: document.getElementById("iTip").value, sebep,
          aciklama: document.getElementById("iAciklama").value.trim(),
          kalemler: secilen,
        });
        // talebi görebilmek için siparişi yeniden çek
