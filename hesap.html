<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hesabım — SLAW REZZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,700;1,900&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/stil.css">
<style>
  .hesap-kutu { max-width: 440px; margin: 0 auto; background: var(--beyaz); border: 1px solid var(--cizgi); padding: 2.2rem; }
  .sekmeler { display: flex; margin-bottom: 1.6rem; border-bottom: 1px solid var(--cizgi); }
  .sekme { flex: 1; background: none; border: none; padding: .8rem; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; border-bottom: 2px solid transparent; }
  .sekme.aktif { border-bottom-color: var(--gul); font-weight: 600; }
  .siparis-kart { border: 1px solid var(--cizgi); background: var(--beyaz); padding: 1.2rem; margin-bottom: 1rem; }
  .durum-etiket { display: inline-block; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; padding: .25rem .7rem; border-radius: 999px; background: var(--gul-acik); color: var(--gul); }
</style>
</head>
<body data-kok="">
<div class="duyuru">1.500 TL üzeri kargo bedava — WhatsApp sipariş: 0541 348 39 45</div>
<header class="ustbar">
  <a class="logo" href="index.html">SLAW <em>REZZ</em></a>
  <nav class="menu"><a href="index.html">Mağaza</a><a href="hukuk/iletisim.html">İletişim</a></nav>
  <div class="ust-ikonlar">
    <a class="aktif" href="hesap.html">Hesabım</a>
    <a class="sepet-link" href="sepet.html">Sepet<span class="sepet-sayac" style="display:none">0</span></a>
  </div>
</header>

<main class="bolum"><div id="icerik"></div></main>

<footer><div class="telif"><span>© <span data-yil></span> SLAW REZZ</span>
<span><a href="hukuk/kvkk.html" style="text-decoration:underline">KVKK</a></span></div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/magaza.js"></script>
<script>
(async function () {
  const kok = document.getElementById("icerik");

  // Ödeme dönüşü bilgilendirmesi — üyelik kontrolünden ÖNCE çalışmalı, yoksa
  // Supabase kapalıyken müşteri ödeme sonrası hiçbir mesaj görmez.
  const qp = new URLSearchParams(location.search);
  if (qp.get("odeme")) {
    const basarili = qp.get("odeme") === "basarili";
    const b = document.createElement("div");
    b.className = "uyari";
    b.style.cssText = "max-width:640px;margin:0 auto 1.4rem;" +
      (basarili ? "border-color:#2f9e44;background:#e7f5ec" : "");
    b.innerHTML = basarili
      ? "<b>Ödemeniz alındı!</b> Siparişiniz" +
        (qp.get("no") ? " <b>" + qp.get("no").replace(/[<>&"]/g, "") + "</b> numarasıyla" : "") +
        " hazırlanmaya başlanacak."
      : 'Ödeme tamamlanamadı. Sepetiniz duruyor; <a href="sepet.html" style="text-decoration:underline">tekrar deneyebilir</a> ' +
        "veya WhatsApp'tan sipariş verebilirsiniz.";
    kok.before(b);
    history.replaceState({}, "", location.pathname);
  }

  if (!SLAW.auth.aktif()) {
    kok.innerHTML = `<div class="bos-durum">
      <div class="buyuk-harf">Üyelik çok yakında</div>
      <p>Üyelik sistemi kuruluyor. Şimdilik siparişlerinizi üyeliksiz verebilir,
        <a href="siparis-takip.html" style="text-decoration:underline">sipariş takip sayfasından</a>
        durumunu izleyip iade talebi oluşturabilirsiniz.</p><br>
      <a class="buton" href="index.html#koleksiyon">Alışverişe Devam</a>
      <a class="buton ikincil" href="siparis-takip.html">Sipariş Takip</a></div>`;
    return;
  }

  const kullanici = await SLAW.auth.kullanici();
  if (kullanici) { profilGoster(kullanici); return; }

  kok.innerHTML = `
  <div class="hesap-kutu">
    <div class="sekmeler">
      <button class="sekme aktif" data-s="giris">Giriş Yap</button>
      <button class="sekme" data-s="kayit">Üye Ol</button>
    </div>
    <div class="form-alan kayit-alan" style="display:none"><label>Ad Soyad</label><input id="hAd"></div>
    <div class="form-alan"><label>E-posta</label><input id="hEposta" type="email" autocomplete="email"></div>
    <div class="form-alan"><label>Şifre</label><input id="hSifre" type="password" autocomplete="current-password"></div>
    <div class="onay-satir kayit-alan" style="display:none"><input type="checkbox" id="hKvkk">
      <span><a href="hukuk/kvkk.html" target="_blank" style="text-decoration:underline">KVKK Aydınlatma Metni</a>'ni okudum; üyelik kapsamında kişisel verilerimin işlenmesine açık rıza veriyorum.</span></div>
    <button class="buton" id="hGonder" style="width:100%;justify-content:center">Giriş Yap</button>
    <div id="hMesaj"></div>
  </div>`;

  let mod = "giris";
  document.querySelectorAll(".sekme").forEach(s => s.onclick = () => {
    mod = s.dataset.s;
    document.querySelectorAll(".sekme").forEach(x => x.classList.toggle("aktif", x === s));
    document.querySelectorAll(".kayit-alan").forEach(x => x.style.display = mod === "kayit" ? "" : "none");
    document.getElementById("hGonder").textContent = mod === "kayit" ? "Üye Ol" : "Giriş Yap";
  });

  document.getElementById("hGonder").onclick = async () => {
    const m = document.getElementById("hMesaj");
    try {
      if (mod === "kayit") {
        if (!document.getElementById("hKvkk").checked) throw new Error("KVKK onayı gerekli.");
        const { error } = await SLAW.auth.kayit(hEposta.value.trim(), hSifre.value, hAd.value.trim());
        if (error) throw error;
        m.innerHTML = '<div class="uyari">Kayıt alındı! E-postanıza gelen doğrulama bağlantısına tıklayın.</div>';
      } else {
        const { error } = await SLAW.auth.giris(hEposta.value.trim(), hSifre.value);
        if (error) throw error;
        location.reload();
      }
    } catch (e) { m.innerHTML = '<div class="uyari">' + (e.message || e) + '</div>'; }
  };

  async function profilGoster(k) {
    const sb = SLAW.sb();
    const [{ data: siparisler }, iadeler] = await Promise.all([
      sb.from("siparisler").select("*").eq("kullanici_id", k.id).order("created_at", { ascending: false }),
      SLAW.iadeTalepleriGetir({ kullanici_id: k.id }),
    ]);
    const durumlar = SLAW.durumHaritasi("musteri");
    kok.innerHTML = `
      <div class="bolum-baslik"><h2>Merhaba, <em>${k.user_metadata?.ad || k.email}</em></h2>
        <button class="buton ikincil" id="cikisBtn">Çıkış Yap</button></div>
      <h3 style="font-family:var(--serif);margin-bottom:1rem">Siparişlerim</h3>
      ${(siparisler || []).length ? siparisler.map(s => `
        <div class="siparis-kart">
          <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem">
            <b>${s.siparis_no || "#" + String(s.id).slice(0, 8)}</b>
            <span class="durum-etiket" style="background:${SLAW.durumRengi(s.durum)}22;color:${SLAW.durumRengi(s.durum)}">${durumlar[s.durum] || s.durum}</span>
          </div>
          <div style="font-size:.78rem;color:var(--murekkep-yum)">${new Date(s.created_at).toLocaleDateString("tr-TR")}</div>
          <div style="font-size:.85rem;color:var(--murekkep-yum);margin:.5rem 0">
            ${(s.kalemler || []).map(x => `${x.ad} (${x.beden} × ${x.adet})`).join(" · ")}</div>
          ${s.kargo_takip ? `<div style="font-size:.82rem;margin-bottom:.4rem">
            ${SLAW.kargoFirmaAdi(s.kargo_firma) || "Kargo"}:
            ${SLAW.kargoTakipLinki(s.kargo_firma, s.kargo_takip)
              ? `<a href="${SLAW.kargoTakipLinki(s.kargo_firma, s.kargo_takip)}" target="_blank" rel="noopener"
                    style="text-decoration:underline;color:var(--gul)">${s.kargo_takip} ↗</a>`
              : `<b>${s.kargo_takip}</b>`}
          </div>` : ""}
          <div style="display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap">
            <div class="kart-fiyat">${SLAW.para(s.tutar)}</div>
            ${(() => {
              const acik = (iadeler || []).find(i => String(i.siparis_id) === String(s.id) &&
                ["talep_edildi", "onaylandi", "kargoda"].includes(i.durum));
              if (acik) {
                const r = SLAW.durumRengi(acik.durum, "iade");
                return `<span class="durum-etiket" style="background:${r}22;color:${r}">İade: ${SLAW.durumAdi(acik.durum, "musteri", "iade")}</span>`;
              }
              return SLAW.iadeEdilebilirMi(s)
                ? `<a class="buton ikincil" style="font-size:.72rem;padding:.5rem 1rem" href="siparis-takip.html?no=${encodeURIComponent(s.siparis_no || "")}">İade / Değişim Talebi</a>`
                : "";
            })()}
          </div>
        </div>`).join("") : "<p style='color:var(--murekkep-yum)'>Henüz siparişiniz yok.</p>"}`;
    document.getElementById("cikisBtn").onclick = async () => { await SLAW.auth.cikis(); location.reload(); };
  }
})();
</script>
</body>
</html>
