<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ürün — SLAW REZZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,700;1,900&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/stil.css">
<style>
  /* Ürün Bilgileri bölümü (Trendyol tarzı) */
  .bilgi-bolum { border: 1px solid var(--cizgi); background: var(--beyaz); margin-top: 3rem; }
  .bilgi-bolum > h3 {
    font-family: var(--serif); font-size: 1.15rem; font-weight: 900;
    padding: 1.1rem 1.4rem; border-bottom: 1px solid var(--cizgi);
  }
  .bilgi-ic { padding: 1.4rem; display: grid; grid-template-columns: 1.2fr .8fr; gap: 2rem; }
  .bilgi-ic h4 { font-size: .95rem; margin-bottom: .7rem; }
  .aciklama-liste { list-style: none; display: grid; gap: .45rem; }
  .aciklama-liste li { font-size: .86rem; color: var(--murekkep-yum); padding-left: 1rem; position: relative; }
  .aciklama-liste li::before { content: "–"; position: absolute; left: 0; color: var(--gul); }
  .ek-bilgi li::before { content: "•"; }
  /* özellikler: moda kataloğu tarzı noktalı cetvel — kutu/ızgara YOK */
  .ozellik-izgara {
    columns: 2; column-gap: 3.5rem; padding: 1.4rem 1.8rem;
    border-top: 1px solid var(--cizgi);
  }
  .ozellik {
    display: flex; align-items: baseline; gap: .5rem;
    font-size: .84rem; padding: .42rem 0; break-inside: avoid;
  }
  .ozellik::before { content: "◦"; color: var(--gul); }
  .ozellik span { color: var(--murekkep-yum); flex-shrink: 0; }
  .ozellik i {
    flex: 1; border-bottom: 1px dotted var(--cizgi);
    transform: translateY(-4px); min-width: 1.5rem;
  }
  .ozellik b { font-family: var(--serif); font-weight: 700; font-style: italic; text-align: right; }
  @media (max-width: 640px) { .ozellik-izgara { columns: 1; } }
  .daralt { display: none; }
  .daralt.acik { display: grid; }
  .goster-butonu {
    display: block; margin: .8rem auto 1.2rem; background: var(--krem);
    border: 1px solid var(--cizgi); border-radius: 999px; padding: .45rem 1.4rem;
    font-size: .7rem; letter-spacing: .14em; text-transform: uppercase;
  }
  .wp-satir { display: flex; gap: .8rem; flex-wrap: wrap; margin-top: .8rem; }
  .buton.wp { background: #128c4a; border-color: #128c4a; }
  .buton.wp:hover { background: #0d6e3a; border-color: #0d6e3a; }
  @media (max-width: 860px) { .bilgi-ic { grid-template-columns: 1fr; } }
</style>
</head>
<body data-kok="">
<div class="duyuru">1.500 TL üzeri kargo bedava — WhatsApp sipariş: 0541 348 39 45</div>
<header class="ustbar">
  <a class="logo" href="index.html">SLAW <em>REZZ</em></a>
  <nav class="menu">
    <a href="index.html">Mağaza</a>
    <a href="index.html#koleksiyon">Koleksiyon</a>
    <a href="hukuk/iletisim.html">İletişim</a>
  </nav>
  <div class="ust-ikonlar">
    <a href="hesap.html">Hesabım</a>
    <a class="sepet-link" href="sepet.html">Sepet<span class="sepet-sayac" style="display:none">0</span></a>
  </div>
</header>

<main class="bolum" id="icerik">
  <div class="bos-durum" id="yukleniyor"><p>Ürün yükleniyor…</p></div>
</main>

<footer>
  <div class="telif">
    <span>© <span data-yil></span> SLAW REZZ</span>
    <span><a href="hukuk/kvkk.html" style="text-decoration:underline">KVKK</a> · <a href="hukuk/mesafeli-satis.html" style="text-decoration:underline">Mesafeli Satış</a></span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/magaza.js"></script>
<script>
(async function () {
  const id = new URLSearchParams(location.search).get("id");
  const u = await SLAW.urunGetir(id);
  const yorumVeri = await SLAW.yorumlariGetir();
  const yv = yorumVeri.urunler?.[id];
  const kok = document.getElementById("icerik");
  if (!u) {
    kok.innerHTML = '<div class="bos-durum"><div class="buyuk-harf">Ürün bulunamadı</div><a class="buton" href="index.html">Mağazaya Dön</a></div>';
    return;
  }
  document.title = u.ad + " — SLAW REZZ";
  SLAW.olayKaydet("urun", u.id);
  const ind = SLAW.indirimBilgi(u);
  let secilenBeden = null;

  const tumu = (await SLAW.urunleriGetir()).filter(m => m.aktif && m.toplamStok > 0);
  const varyantlar = tumu.filter(m => SLAW.grupAnahtari(m) === SLAW.grupAnahtari(u));
  const bedenler = Object.entries(u.bedenler || {});
  const maddeler = (u.aciklama || "").split(/;\s*-\s*|\n-\s*/).map(s => s.replace(/^[-\s]+/, "").trim()).filter(Boolean);
  const ozellikler = Object.entries(u.ozellikler || {});

  kok.innerHTML = `
  <div class="detay">
    <div class="galeri">
      <div class="buyuk" style="position:relative">
        ${ind?.etiket ? `<div class="avantaj-balon buyuk ${ind.sinif}">${ind.etiket}</div>` : ""}
        ${u.flas ? '<span class="flas-rozet">⚡ Flaş Ürün</span>' : ""}
        ${u.gorseller.length > 1 ? `
        <button class="galeri-ok sol" id="okSol" aria-label="önceki görsel">‹</button>
        <button class="galeri-ok sag" id="okSag" aria-label="sonraki görsel">›</button>` : ""}
        <img id="buyukImg" src="${u.gorseller[0] || ""}" alt="${u.ad}"></div>
      <div class="kucukler" id="kucukler">
        ${u.gorseller.slice(0, 14).map((g, i) => `<img src="${g}" alt="" class="${i === 0 ? "secili" : ""}" data-i="${i}" loading="lazy">`).join("")}
      </div>
    </div>
    <div class="detay-bilgi">
      <span class="kart-kategori">${u.kategori || ""} — SLAW REZZ</span>
      <h1>${u.ad}</h1>
      <div style="display:flex;align-items:baseline;gap:.9rem;flex-wrap:wrap;font-size:.85rem">
        ${yv ? `<a href="#degerlendirmeler" class="kart-yildiz" style="font-size:.85rem">${SLAW.yildizlar(yv.ortalama)} <span>${yv.ortalama} — ${yv.sayi} değerlendirme</span></a>` : ""}
        ${yv ? '<span style="color:var(--cizgi)">|</span>' : ""}
        <a href="#soruCevap" id="hizliSoruLink" style="color:var(--murekkep-yum);text-decoration:underline;text-underline-offset:3px">Satıcıya Soru Sor</a>
      </div>
      <div class="detay-fiyat ${ind ? "fiyat-indirimli" : ""}">${SLAW.para(u.satisFiyat)}
        ${ind ? `<s>${SLAW.para(u.listeFiyat)}</s> <span class="fiyat-yuzde" style="vertical-align:middle">−%${ind.yuzde}</span>` : ""}</div>
      ${varyantlar.length > 1 ? `
      <div style="font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--murekkep-yum)">Renk — <b style="color:var(--murekkep)">${SLAW.renkAdi(u)}</b></div>
      <div class="renk-secim">
        ${varyantlar.map(v => `<a class="renk-kutu ${v.id === u.id ? "secili" : ""}" href="urun.html?id=${encodeURIComponent(v.id)}" title="${SLAW.renkAdi(v)}">
          <img src="${v.gorseller[0] || ""}" alt="${SLAW.renkAdi(v)}"></a>`).join("")}
      </div>` : ""}
      <div style="font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--murekkep-yum)">Beden</div>
      <div class="beden-secim" id="bedenler">
        ${bedenler.map(([b, stok]) =>
          `<button class="beden ${stok <= 0 ? "yok" : ""}" data-beden="${b}" ${stok <= 0 ? "disabled" : ""}>${b}</button>`).join("")}
      </div>
      <div class="wp-satir">
        <button class="buton" id="sepeteEkleBtn">Sepete Ekle</button>
        <a class="buton wp" id="wpBtn" target="_blank" rel="noopener">WhatsApp'tan Sipariş</a>
      </div>
      <div class="uyari" id="bedenUyari" style="display:none">Lütfen önce beden seçin.</div>
      <div class="guven-listesi">
        <span>✓ iyzico güvencesiyle 3D Secure ödeme</span>
        <span>✓ 15 gün içinde ücretsiz iade</span>
        <span>✓ 1.500 TL üzeri kargo bedava</span>
      </div>
    </div>

    <aside class="detay-yorum" id="degerlendirmeler">
      <h3>Müşteri Değerlendirmeleri</h3>
      ${yv ? `
      <div class="kart-yildiz" style="font-size:.9rem;margin-bottom:.9rem">${SLAW.yildizlar(yv.ortalama)} <span>${yv.ortalama} / 5 — ${yv.sayi} değerlendirme</span></div>
      ${yv.yorumlar.map(y => `
        <div class="yorum-kart">
          ${y.puan ? `<span class="yildiz" style="font-size:.8rem">${SLAW.yildizlar(y.puan)}</span>` : ""}
          <p style="font-size:.84rem">${y.metin}</p>
          <div class="kim">${y.ad || "****"}${y.tarih ? " — " + new Date(y.tarih).toLocaleDateString("tr-TR") : ""}</div>
        </div>`).join("")}
      <p class="kaynak-notu">Bu değerlendirmeler, ürünü <a href="${(u.trendyolUrl || SLAW.config.trendyolUrl).split("?")[0]}" target="_blank" rel="noopener">Trendyol mağazamızdan</a> satın alan doğrulanmış alıcılara aittir; isimler gizlenmiştir.</p>`
      : `<p style="font-size:.86rem;color:var(--murekkep-yum)">Bu ürün için henüz değerlendirme yok.</p>
         <p style="font-size:.8rem;color:var(--murekkep-yum);margin-top:.6rem">Aklınıza takılan bir şey mi var? <a href="#soruCevap" style="text-decoration:underline;color:var(--gul)">Satıcıya sorun</a>.</p>`}
    </aside>
  </div>

  <div class="bilgi-bolum">
    <h3>Ürün Bilgileri</h3>
    <div class="bilgi-ic">
      <div>
        <h4>Ürün Açıklaması</h4>
        <ul class="aciklama-liste" id="aciklamaListe">
          ${maddeler.slice(0, 8).map(m => `<li>${m}</li>`).join("")}
          ${maddeler.slice(8).map(m => `<li class="daralt">${m}</li>`).join("")}
        </ul>
        ${maddeler.length > 8 ? '<button class="goster-butonu" data-hedef="aciklamaListe">Daha Fazla Göster ▾</button>' : ""}
      </div>
      <div>
        <h4>Ek Bilgiler</h4>
        <ul class="aciklama-liste ek-bilgi">
          <li>Bu ürün <b>SLAW REZZ</b> tarafından gönderilecektir.</li>
          <li>15 gün içinde ücretsiz iade. Detay: <a href="hukuk/iade.html" style="text-decoration:underline">iade koşulları</a>.</li>
          <li>Siparişler 1-3 iş günü içinde kargoya verilir.</li>
          <li>Sorularınız için WhatsApp: 0541 348 39 45</li>
        </ul>
      </div>
    </div>
    ${ozellikler.length ? `
    <h3 style="border-top:1px solid var(--cizgi)">Ürün Özellikleri</h3>
    <div class="ozellik-izgara" id="ozellikIzgara">
      ${ozellikler.slice(0, 12).map(([k, v]) => `<div class="ozellik"><span>${k}</span><i></i><b>${v}</b></div>`).join("")}
      ${ozellikler.slice(12).map(([k, v]) => `<div class="ozellik daralt"><span>${k}</span><i></i><b>${v}</b></div>`).join("")}
    </div>
    ${ozellikler.length > 12 ? '<button class="goster-butonu" data-hedef="ozellikIzgara">Tüm Özellikleri Göster ▾</button>' : ""}` : ""}
  </div>

  <div id="soruCevap" style="margin-top:3.5rem">
    <div class="bolum-baslik">
      <h2>Soru <em>&amp; Cevap</em></h2>
      <button class="buton ikincil" id="soruSorBtn">Satıcıya Soru Sor</button>
    </div>
    <div id="soruListe"></div>
    <div id="soruFormKutu" style="display:none;max-width:560px;background:var(--beyaz);border:1px solid var(--cizgi);padding:1.6rem;margin-top:1rem">
      <div class="form-alan" id="misafirAdAlan" style="display:none"><label>Adınız</label><input id="soruAd"></div>
      <div class="form-alan"><label>Sorunuz</label>
        <textarea id="soruMetin" rows="3" placeholder="Örn: Bu ürünün kumaşı esnek mi? Kalıbı dar mı?"></textarea></div>
      <p style="font-size:.74rem;color:var(--murekkep-yum);margin-bottom:.8rem">
        Sorunuz satıcı tarafından yanıtlandıktan sonra bu sayfada yayınlanır. Kişisel bilgi (telefon, adres) yazmayınız.</p>
      <button class="buton" id="soruGonderBtn">Soruyu Gönder</button>
      <div id="soruMesaj"></div>
    </div>
  </div>

  <div class="bolum-baslik" style="margin-top:3.5rem">
    <h2>İlginizi çekebilecek <em>diğer ürünler</em></h2>
    <div style="display:flex;gap:.5rem">
      <button class="serit-ok" id="benzerSol" aria-label="geri">‹</button>
      <button class="serit-ok" id="benzerSag" aria-label="ileri">›</button>
    </div>
  </div>
  <div class="benzer-serit" id="benzerler"></div>`;

  // galeri — görsel değişimi yalnızca kullanıcı kontrolünde (ok/küçük resim/klavye)
  const galeriGorseller = u.gorseller.slice(0, 14);
  let aktifGorsel = 0;
  function gorselGoster(i) {
    aktifGorsel = (i + galeriGorseller.length) % galeriGorseller.length;
    document.getElementById("buyukImg").src = galeriGorseller[aktifGorsel];
    document.querySelectorAll("#kucukler img").forEach((x, xi) => {
      x.classList.toggle("secili", xi === aktifGorsel);
      if (xi === aktifGorsel) x.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" });
    });
  }
  document.getElementById("kucukler").addEventListener("click", (e) => {
    if (e.target.tagName === "IMG") gorselGoster(+e.target.dataset.i);
  });
  const okSol = document.getElementById("okSol"), okSag = document.getElementById("okSag");
  if (okSol) okSol.onclick = () => gorselGoster(aktifGorsel - 1);
  if (okSag) okSag.onclick = () => gorselGoster(aktifGorsel + 1);
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    if (e.key === "ArrowLeft") gorselGoster(aktifGorsel - 1);
    if (e.key === "ArrowRight") gorselGoster(aktifGorsel + 1);
  });

  // beden seçimi
  document.getElementById("bedenler").addEventListener("click", (e) => {
    const b = e.target.closest(".beden:not(.yok)");
    if (!b) return;
    secilenBeden = b.dataset.beden;
    document.querySelectorAll(".beden").forEach(x => x.classList.toggle("secili", x === b));
    document.getElementById("bedenUyari").style.display = "none";
    wpGuncelle();
  });

  function wpGuncelle() {
    const metin = `Merhaba, "${u.ad}" ürününü sipariş etmek istiyorum.` +
      (secilenBeden ? ` Beden: ${secilenBeden}.` : "") + ` Fiyat: ${SLAW.para(u.satisFiyat)}. Link: ${location.href}`;
    document.getElementById("wpBtn").href = SLAW.whatsappLinki(metin);
  }
  wpGuncelle();

  document.getElementById("sepeteEkleBtn").onclick = () => {
    if (!secilenBeden) { document.getElementById("bedenUyari").style.display = "block"; return; }
    SLAW.sepeteEkle(u.id, secilenBeden, 1);
    SLAW.pixelOlay("AddToCart", { content_name: u.ad, value: u.satisFiyat, currency: "TRY" });
    const btn = document.getElementById("sepeteEkleBtn");
    btn.textContent = "✓ Sepete Eklendi";
    setTimeout(() => (btn.textContent = "Sepete Ekle"), 1800);
  };

  // daha fazla göster
  document.querySelectorAll(".goster-butonu").forEach(btn => {
    btn.onclick = () => {
      const acik = btn.classList.toggle("acildi");
      document.querySelectorAll("#" + btn.dataset.hedef + " .daralt")
        .forEach(x => (x.style.display = acik ? (x.tagName === "LI" ? "list-item" : "flex") : "none"));
      btn.textContent = acik ? "Daha Az Göster ▴" : "Daha Fazla Göster ▾";
    };
  });

  // soru & cevap — mağazamıza gelen sorular (aktarılan + site üzerinden sorulanlar)
  async function sorulariCiz() {
    const yayindakiler = (await SLAW.sorulariGetir(u.id)).filter(s => s.yayinda && s.cevap);
    // aktarılan hazır sorular: bu model + aynı modelin diğer renkleri
    const hazir = await SLAW.hazirSorulariGetir();
    const grupIdler = varyantlar.map(v => v.id);
    const gorulen = new Set();
    const hazirListe = [];
    grupIdler.forEach(id => (hazir.urunler?.[id] || []).forEach(q => {
      if (gorulen.has(q.soru)) return;
      gorulen.add(q.soru);
      hazirListe.push(q);
    }));
    const kartlar = [
      ...yayindakiler.map(s => ({ soru: s.soru, cevap: s.cevap, tarih: s.cevap_tarihi })),
      ...hazirListe,
    ];
    document.getElementById("soruListe").innerHTML = kartlar.length
      ? `<p style="font-size:.82rem;color:var(--murekkep-yum);margin-bottom:.9rem">Mağazamıza bu ürün hakkında gelen sorular ve yanıtlarımız:</p>`
        + kartlar.map(s => `
        <div class="yorum-kart" style="margin-bottom:.8rem">
          <p><b style="color:var(--gul)">S:</b> ${s.soru}</p>
          <p><b style="color:var(--murekkep)">C:</b> ${s.cevap}</p>
          <div class="kim">SLAW REZZ yanıtladı${s.tarih ? " — " + new Date(s.tarih).toLocaleDateString("tr-TR") : ""}</div>
        </div>`).join("")
      : '<p style="color:var(--murekkep-yum);font-size:.9rem">Bu ürün hakkında henüz yanıtlanmış soru yok. İlk soruyu siz sorun!</p>';
  }
  sorulariCiz();

  document.getElementById("hizliSoruLink").onclick = () => {
    setTimeout(() => document.getElementById("soruSorBtn").click(), 150);
  };

  document.getElementById("soruSorBtn").onclick = async () => {
    const sbAktif = !!SLAW.sb();
    if (sbAktif && !(await SLAW.auth.kullanici())) {
      document.getElementById("soruMesaj").innerHTML = "";
      document.getElementById("soruFormKutu").style.display = "block";
      document.getElementById("soruFormKutu").innerHTML =
        '<p style="font-size:.9rem">Soru sormak için üye girişi yapmanız gerekiyor.</p><br>' +
        '<a class="buton" href="hesap.html">Giriş Yap / Üye Ol</a>';
      return;
    }
    if (!sbAktif) document.getElementById("misafirAdAlan").style.display = "";
    document.getElementById("soruFormKutu").style.display = "block";
    document.getElementById("soruMetin").focus();
  };

  document.getElementById("soruGonderBtn").onclick = async () => {
    const mesaj = document.getElementById("soruMesaj");
    const metin = document.getElementById("soruMetin").value.trim();
    if (metin.length < 5) { mesaj.innerHTML = '<div class="uyari">Lütfen sorunuzu yazın.</div>'; return; }
    try {
      await SLAW.soruSor(u.id, metin, document.getElementById("soruAd")?.value.trim());
      document.getElementById("soruMetin").value = "";
      mesaj.innerHTML = '<div class="uyari" style="border-color:#2f9e44;background:#e7f5ec">Sorunuz alındı! Satıcı yanıtladığında bu sayfada yayınlanacak.</div>';
    } catch (e) {
      mesaj.innerHTML = '<div class="uyari">' + (e.message === "giris_gerekli" ? "Soru sormak için üye girişi gerekli." : "Soru gönderilemedi: " + e.message) + '</div>';
    }
  };

  // görsel büyüteç: fare görselin üzerinde gezinirken o bölge yakınlaşır
  const buyukKutu = document.querySelector(".buyuk");
  const buyukImgEl = document.getElementById("buyukImg");
  if (window.matchMedia("(pointer: fine)").matches) {
    buyukKutu.addEventListener("mousemove", (e) => {
      const r = buyukKutu.getBoundingClientRect();
      const x = ((e.clientX - r.left) / r.width) * 100;
      const y = ((e.clientY - r.top) / r.height) * 100;
      buyukImgEl.style.transformOrigin = `${x}% ${y}%`;
      buyukImgEl.style.transform = "scale(2.1)";
    });
    buyukKutu.addEventListener("mouseleave", () => {
      buyukImgEl.style.transform = "";
    });
  }

  // ilginizi çekebilecek diğer ürünler — kayan şerit
  const hepsi = tumu.filter(m => m.id !== u.id);
  const ayniKategori = hepsi.filter(m => m.kategori === u.kategori);
  const digerleri = hepsi.filter(m => m.kategori !== u.kategori);
  const benzer = ayniKategori.concat(digerleri).slice(0, 12);
  document.getElementById("benzerler").innerHTML = benzer.map(m => `
    <a class="kart" href="urun.html?id=${encodeURIComponent(m.id)}">
      <div class="kart-gorsel"><img class="bir" src="${m.gorseller[0] || ""}" alt="${m.ad}" loading="lazy"></div>
      <div class="kart-ad">${m.ad}</div>
      <div class="kart-alt"><span class="kart-fiyat">${SLAW.para(m.satisFiyat)}</span></div>
      <div class="kart-iade">15 gün içinde ücretsiz iade</div>
    </a>`).join("");
  const serit = document.getElementById("benzerler");
  document.getElementById("benzerSol").onclick = () => serit.scrollBy({ left: -serit.clientWidth * 0.8 });
  document.getElementById("benzerSag").onclick = () => serit.scrollBy({ left: serit.clientWidth * 0.8 });

  SLAW.pixelOlay("ViewContent", { content_name: u.ad, value: u.satisFiyat, currency: "TRY" });
})();
</script>
